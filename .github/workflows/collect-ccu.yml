name: collect-ccu
on:
  schedule:
    # daily tier — 采样时刻逐日轮转 (6 个基准小时)。固定时刻会让月均值变成
    # "每天那个时段读数的均值", 不是"全天各时段的均值" —— 不同的统计量。
    # GH cron 的抖动在这里**有益**: 等于给轮转再叠一层随机化。
    # :07 偏移躲开整点拥堵 (同 prices repo)。
    - cron: '7 0 1,7,13,19,25,31 * *'
    - cron: '7 4 2,8,14,20,26 * *'
    - cron: '7 8 3,9,15,21,27 * *'
    - cron: '7 12 4,10,16,22,28 * *'
    - cron: '7 16 5,11,17,23,29 * *'
    - cron: '7 20 6,12,18,24,30 * *'
    # sparse tier — 周四 02:07 UTC (与 daily 的任一基准小时都不撞)
    - cron: '7 2 * * 4'
  workflow_dispatch:
    inputs:
      tier:
        description: 'tier to collect'
        required: true
        default: 'daily'
        type: choice
        options: [daily, sparse, top]

permissions:
  contents: write

# 同一 tier 不重入; 不取消进行中的 (半趟数据也要提交)
concurrency:
  group: collect-ccu
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    # 分片后 daily 每片 ~2.5h sleep + 请求延迟; 5.5h 是余量翻倍后的上限 (GH 硬上限 6h)。
    # ⚠ 历史: tier 长到 13.9k 款时单 job 5h30 连续三轮被砍 (2026-08-27..29), 尾部同一批
    #   ~900 款每天缺失。matrix 2 分片是结构修法; tier 再长到 ~26k 时把 SHARDS 提到 3。
    timeout-minutes: 330
    strategy:
      fail-fast: false          # 一片挂掉不连坐另一片
      matrix:
        shard: [0, 1]
    steps:
      - uses: actions/checkout@v4

      # ⚠ 用 github.event.schedule (触发本次运行的那条 cron 原文) 判 tier, **不要用
      # date 判钟点** —— GH 的 schedule 会延迟, 一延迟 date 就落到别的小时, sparse
      # 那趟会被误判成 daily。schedule 字符串不受延迟影响。
      - name: Pick tier
        id: pick
        env:
          SCHED: ${{ github.event.schedule }}
          INPUT: ${{ inputs.tier }}
        run: |
          if   [ -n "$INPUT" ];          then T="$INPUT"
          elif [ "$SCHED" = '7 2 * * 4' ]; then T=sparse
          else                                T=daily; fi
          echo "tier=$T" >> $GITHUB_OUTPUT
          echo "tier=$T  (schedule='$SCHED' input='$INPUT')"

      # daily 走分片; sparse/top 单趟足够 (1.2h/瞬时), 只让 shard 0 跑, shard 1 空过
      - name: Collect
        if: steps.pick.outputs.tier == 'daily' || matrix.shard == 0
        run: |
          if [ "${{ steps.pick.outputs.tier }}" = daily ]; then
            python3 collect.py daily --shard ${{ matrix.shard }}/2
          else
            python3 collect.py ${{ steps.pick.outputs.tier }}
          fi

      # always(): 超时/失败也提交已落盘的部分 —— 丢一趟的尾巴好过丢整趟。
      # 两片并发收尾会抢 push (各写自己的 _sN 文件, rebase 永无内容冲突,
      # 只是 non-fast-forward 竞争) → 重试到赢为止。
      - name: Commit data
        if: always() && (steps.pick.outputs.tier == 'daily' || matrix.shard == 0)
        run: |
          git config user.name 'steamcozy-bot'
          git config user.email 'suggest@steamcozy.com'
          git add data
          git commit -m "ccu ${{ steps.pick.outputs.tier }} s${{ matrix.shard }} $(date -u +'%Y-%m-%d %H:%M') UTC" \
            || { echo 'nothing to commit'; exit 0; }
          for i in 1 2 3 4 5; do
            git pull --rebase -q && git push && exit 0
            echo "push race (attempt $i), retrying"; sleep $((5 + RANDOM % 20))
          done
          echo 'push failed after 5 attempts'; exit 1
